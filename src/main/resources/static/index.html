<!DOCTYPE html>
<html>
<head>
    <title>Flashcard App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        input {
            display: block;
            margin-bottom: 10px;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="loginSection">
        <h2>Enter Your Name</h2>
        <input type="text" id="usernameInput" placeholder="Your name">
        <button onclick="startSession()">Start</button>
    </div>

    <div id="appSection" style="display:none;">
        <h1>Flashcard App</h1>

        <h2>Add a Card</h2>
        <input type="text" id="questionInput" placeholder="Enter question">
        <input type="text" id="answerInput" placeholder="Enter answer">
        <button onclick="addCard()">Add Card</button>

        <h2>Your Cards</h2>
        <div id="cardList"></div>
    </div>

    <script>
        let username = '';

        function startSession() {
            username = document.getElementById('usernameInput').value.trim();
            if (username === '') {
                alert('Please enter a name');
                return;
            }
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            loadCards();
        }

        function loadCards() {
            fetch('/cards?user=' + encodeURIComponent(username))
                .then(response => response.json())
                .then(cards => {
                    const cardList = document.getElementById('cardList');
                    cardList.innerHTML = '';
                    cards.forEach(card => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = '<strong>Q: ' + card.question + '</strong><br>A: ' + card.answer;
                        cardList.appendChild(div);
                    });
                });
        }

        function addCard() {
            const question = document.getElementById('questionInput').value;
            const answer = document.getElementById('answerInput').value;

            fetch('/cards?user=' + encodeURIComponent(username) + '&question=' + encodeURIComponent(question) + '&answer=' + encodeURIComponent(answer), {
                method: 'POST'
            })
                .then(response => response.text())
                .then(message => {
                    document.getElementById('questionInput').value = '';
                    document.getElementById('answerInput').value = '';
                    loadCards();
                });
        }
    </script>

</body>
</html>
